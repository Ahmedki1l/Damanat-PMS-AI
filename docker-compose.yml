# docker-compose.yml
# Starts SQL Server + the FastAPI backend together.
# Usage: docker-compose up -d

version: "3.9"

services:

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: damanat_sql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DamanatPms2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P DamanatPms2026! -Q 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: damanat_backend
    restart: unless-stopped
    depends_on:
      sql-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      DATABASE_URL: mssql+pyodbc://sa:DamanatPms2026!@sql-server:1433/master?driver=ODBC+Driver+17+for+SQL+Server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2

volumes:
  sql_data:
